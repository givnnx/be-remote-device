name: Deploy — Staging / Production

on:
  push:
    branches: [main, master]

concurrency:
  group: deploy-be-remote-device
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.TS_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: ssh://${{ secrets.SSH_USER }}@${{ secrets.TS_SERVER_IP }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/be-remote-device:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TS_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/be-remote-device"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TS_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            mkdir -p ~/be-remote-device
            cd ~/be-remote-device
            
            # Login to Docker Hub on VPS to pull private image
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Write secrets to .env
            cat > .env <<EOF
            DOCKER_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/be-remote-device:latest
            APP_NAME=be-remote-device
            APP_ENV=production
            APP_PORT=${{ secrets.APP_PORT || 0 }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL || 'info' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MASTER_API_KEY=${{ secrets.MASTER_API_KEY }}
            DB_DRIVER=postgres
            DB_HOST=${{ secrets.DB_HOST || 'postgres' }}
            DB_PORT=${{ secrets.DB_PORT || 5432 }}
            DB_USER=${{ secrets.DB_USER || secrets.DB_USERNAME || 'postgres' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME || secrets.DB_DATABASE || 'remote_device_db' }}
            DB_SSLMODE=${{ secrets.DB_SSLMODE || 'disable' }}
            EOF

            # Pull latest image and redeploy
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            # Display allocated random host port
            echo "========================================="
            echo "Allocated Host Port for be-remote-device:"
            docker port be-remote-device 8080 || docker compose port api 8080
            echo "========================================="

            # Clean up dangling images
            docker image prune -f
      
      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
