version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: remote-device-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-remote_device_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-remote_device_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be-remote-device
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=be-remote-device
      - APP_ENV=production
      - APP_PORT=8080
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_in_production}
      - MASTER_API_KEY=${MASTER_API_KEY:-my-super-secret-master-key-12345}
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-remote_device_db}
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
