version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be-remote-device
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=be-remote-device
      - APP_ENV=production
      - APP_PORT=8080
      - LOG_LEVEL=info
